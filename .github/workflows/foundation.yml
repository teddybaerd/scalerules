name: ScaleRules foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          api=$(sed -n 's/^androidApiLevel=//p' android/gradle.properties)
          tools=$(sed -n 's/^androidBuildToolsVersion=//p' android/gradle.properties)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$api" "build-tools;$tools" "ndk;23.1.7779620"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_ENV"
      - name: Build debug APK and run unit tests
        run: make apk
      - name: Check formatting
        run: make fmt-check
      - name: Run Go tests
        run: make go-test
      - name: Run release lint
        run: make release-lint
      - name: Upload development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scalerules-foundation-debug
          path: tailscale-debug.apk
          if-no-files-found: error
          retention-days: 14
