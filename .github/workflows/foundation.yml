name: ScaleRules foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          api=$(sed -n 's/^androidCompileSdk=//p' android/gradle.properties)
          tools=$(sed -n 's/^androidBuildToolsVersion=//p' android/gradle.properties)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$api" "build-tools;$tools" "ndk;23.1.7779620"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/23.1.7779620" >> "$GITHUB_ENV"
      - name: Check translation coverage and format arguments
        run: python3 scripts/check_translations.py
      - name: Build debug APK and run unit tests
        run: make apk
      - name: Build unsigned release APK
        run: cd android && ./gradlew --no-daemon assembleRelease -PSCALERULES_VERSION=0.0.0-ci
      - name: Upload unsigned signing-test fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-unsigned-release
          path: android/build/outputs/apk/release/android-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error
      - name: Check formatting
        run: make fmt-check
      - name: Run Go tests
        run: make go-test
      - name: Run release lint
        run: make release-lint
      - name: Upload development APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scalerules-foundation-debug
          path: tailscale-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-keystore:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Windows key generation and Java PKCS12 compatibility
        shell: powershell
        env:
          SCALERULES_TEST_PASSWORD: ephemeral-ci-test-password-only
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'scalerules-key-test'
          try {
            $password = ConvertTo-SecureString $env:SCALERULES_TEST_PASSWORD -AsPlainText -Force
            $result = & ./scripts/New-ScaleRulesSigningKey.ps1 -OutputDirectory $directory -Password $password
            if ($result.Fingerprint -notmatch '^[0-9a-f]{64}$') { throw 'Invalid certificate fingerprint' }
            keytool -importkeystore -srckeystore $result.KeyStore -srcstoretype PKCS12 -srcstorepass:env SCALERULES_TEST_PASSWORD -destkeystore (Join-Path $directory 'roundtrip.p12') -deststoretype PKCS12 -deststorepass:env SCALERULES_TEST_PASSWORD -noprompt
            if ($LASTEXITCODE -ne 0) { throw 'Java could not read the Windows private key' }
            $failedAsExpected = $false
            try { & ./scripts/New-ScaleRulesSigningKey.ps1 -OutputDirectory $directory -Password $password } catch { $failedAsExpected = $true }
            if (-not $failedAsExpected) { throw 'Existing-key overwrite guard failed' }
          } finally {
            Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction SilentlyContinue
          }

  signing-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-unsigned-release
          path: unsigned
      - name: Verify signing and rejection of a wrong certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ephemeral-ci-test-password-only
          SCALERULES_VERSION: 0.0.0-ci
        run: |
          set -euo pipefail
          tools=$(sed -n 's/^androidBuildToolsVersion=//p' android/gradle.properties)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$tools"
          directory=$(mktemp -d "$RUNNER_TEMP/scalerules-key-test.XXXXXX")
          trap 'rm -rf "$directory"' EXIT
          keytool -genkeypair -keystore "$directory/test.p12" -storetype PKCS12 -alias test-only -keyalg RSA -keysize 4096 -validity 2 -dname CN=CI-only -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD
          keytool -exportcert -keystore "$directory/test.p12" -alias test-only -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$directory/test.cer"
          export ANDROID_SIGNING_CERT_SHA256=$(sha256sum "$directory/test.cer" | cut -d' ' -f1)
          bash scripts/sign-release-apk.sh unsigned/android-release-unsigned.apk "$directory/first.apk" "$directory/test.p12"
          bash scripts/sign-release-apk.sh unsigned/android-release-unsigned.apk "$directory/second.apk" "$directory/test.p12"
          if ANDROID_SIGNING_CERT_SHA256=$(printf '%064d' 0) bash scripts/sign-release-apk.sh unsigned/android-release-unsigned.apk "$directory/rejected.apk" "$directory/test.p12" > "$directory/rejection.log" 2>&1; then
            echo 'Wrong signing certificate was accepted' >&2
            exit 1
          fi
          test ! -e "$directory/rejected.apk"
