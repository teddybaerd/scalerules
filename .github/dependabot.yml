version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: wednesday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    ignore:
      # Vico 2/3 require migrating PingView from the 1.x chart API (reviewed in PR #22).
      - dependency-name: 'com.patrykandpatrick.vico:*'
        update-types: [version-update:semver-major]
    groups:
      android-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Keep normal native-core updates aligned with a reviewed Android upstream release.
    # A limit of zero disables version-update PRs, not Dependabot security-update PRs.
    open-pull-requests-limit: 0
